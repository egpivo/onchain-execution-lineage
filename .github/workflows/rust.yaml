name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Build
        run: cargo build --verbose

      - name: Test with coverage
        # Offline tests only; live_network stays #[ignore].
        # main.rs is CLI glue — excluded from the reported library coverage.
        run: cargo llvm-cov --lcov --output-path lcov.info --ignore-filename-regex 'main\.rs'

      # Public mode only: it reads the tracked evidence snapshot and never
      # touches the private recorded captures or the network. Runs the script
      # readers are told to run, so a broken entry point fails CI.
      - name: Verify the published reference case (public mode)
        run: ./scripts/reproduce_slippage_article.sh --skip-tests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: unittests
          name: onchain-execution-lineage
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
