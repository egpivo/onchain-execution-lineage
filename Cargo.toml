[package]
name = "onchain-execution-lineage"
version = "0.1.0"
edition = "2021"
description = "Read-only Rust toolkit for reconstructing and verifying execution lineage across provider responses, transaction construction, and settlement."
default-run = "onchain-execution-lineage"
license = "MIT"

[lib]
name = "onchain_execution_lineage"
path = "src/lib.rs"

[[bin]]
name = "onchain-execution-lineage"
path = "src/main.rs"

# Deprecated alias, kept so existing scripts and published commands still run.
# Auto-discovered from src/bin/dflow-lineage.rs.

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
base64 = "0.22"
sha2 = "0.10"
csv = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"

solana-sdk = "2.3"
solana-client = "2.3"
solana-transaction-status-client-types = "2.3"
solana-address-lookup-table-interface = "2.2"
bincode = "1"

[dev-dependencies]
wiremock = "0.6"
